<%+header%>
<h2><%:Physical Port Status%></h2>

<button class="cbi-button cbi-button-apply" onclick="loadStatus()"><%:Refresh%></button>

<table class="table">
  <thead>
    <tr>
      <th><%:Port%></th>
      <th><%:Link Status%></th>
      <th><%:Speed (Mb/s)%></th>
      <th><%:Duplex%></th>
    </tr>
  </thead>
  <tbody id="status-table">
    <tr><td colspan="4">Loading...</td></tr>
  </tbody>
</table>

<script type="text/javascript">
function loadStatus() {
  fetch('<%=luci.dispatcher.build_url("admin/status/portstatus/data")%>')
    .then(r => r.json())
    .then(data => {
      const tbody = document.getElementById("status-table");
      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4'>No data</td></tr>";
        return;
      }
      data.forEach(p => {
        const row = `<tr>
          <td>${p.iface}</td>
          <td>${p.status}</td>
          <td>${p.speed}</td>
          <td>${p.duplex}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    });
}

window.addEventListener("load", loadStatus);
</script>

<%+footer%>
